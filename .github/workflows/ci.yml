name: CI

# Fast feedback on every PR before it's mergeable — typecheck, lint, and a
# production build. This is what makes the branch -> PR workflow actually
# useful: a reviewer (human or agent) doesn't have to manually run these
# locally to know a PR is broken. Deliberately doesn't run the Electron
# packaging steps (release.yml) — those are slow (minutes) and only need to
# run when actually cutting a release, not on every PR push.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
